services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: faq
      POSTGRES_USER: faq
      POSTGRES_PASSWORD: faq
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faq -d faq"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - faq-postgres:/var/lib/postgresql/data

volumes:
  faq-postgres:
