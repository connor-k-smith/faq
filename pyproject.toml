[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "faq"
version = "0.1.0"
description = "Agent-assisted, durable internal decision capture"
readme = "README.md"
license = "MIT"
authors = [{ name = "Connor Smith" }]
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "firebase-admin>=7,<8",
  "google-auth>=2.40,<3",
  "jinja2>=3.1,<4",
  "pydantic-ai-slim[google]>=1.0,<2",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.41,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/connor-k-smith/faq"
Repository = "https://github.com/connor-k-smith/faq"
Issues = "https://github.com/connor-k-smith/faq/issues"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = ["integration: requires the local PostgreSQL service and migrated schema"]
filterwarnings = [
  "error::sqlalchemy.exc.SAWarning",
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true
